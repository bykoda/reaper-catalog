name: Publish REAPER catalog

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out reviewed snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify catalog, image files and JavaScript
        run: |
          python3 tools/update_catalog.py
          node --check site/telegram.js
          node --check site/catalog.js
      - name: Prepare site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
